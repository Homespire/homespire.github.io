<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Something Bigger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: the opening of Homespire's year, then a calm one-on-one conversation
IDEA: a campaign launch that turns into a coaching worksheet
PICTURE: the campaign wordmark, then the question and the answer, large
COLOUR and TYPE: Homespire night purple, white, pink to magenta accent; Inter 900 display, Inter body
LAYOUT: welcome poster, one question per screen, a printable plan sheet
*/
:root{color-scheme:dark;--bg:#160329;--bg2:#2a0a57;--ink:#fff;--mut:rgba(255,255,255,.7);--faint:rgba(255,255,255,.45);--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.05);--pink:#f472b6;--mag:#d946ef;--lav:#e9d5ff;--grad:linear-gradient(92deg,#f472b6,#d946ef);--sheet:#fff;--sink:#1c0b33;--sp:#4c1d95;--sacc:#a21caf}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px;background:#160329}
body{margin:0;color:var(--ink);font:16px/1.55 Inter,-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;overflow-x:clip;min-height:100vh;background:radial-gradient(55% 45% at 50% 35%,rgba(126,34,206,.42),transparent 70%),radial-gradient(40% 40% at 85% 95%,rgba(219,39,119,.14),transparent 70%),radial-gradient(35% 35% at 10% 80%,rgba(109,40,217,.18),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{width:26px;height:31px;color:#fff;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px max(4vw,16px);background:linear-gradient(180deg,rgba(22,3,41,.92),rgba(22,3,41,.6) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;letter-spacing:.01em;background:none;border:0;padding:0;cursor:pointer}
.brand small{display:block;font-weight:600;color:var(--faint);font-size:12px}
.top .sp{flex:1}
.saved{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px}
.saved .ico{width:16px;height:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 30px -10px rgba(217,70,239,.7)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.big{min-height:60px;padding:16px 32px;font-size:18px}
.btn.ghost{background:none;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:#fff;background:var(--panel)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;padding:6px 0;color:var(--lav);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:8px;align-items:center;min-height:44px}

/* welcome */
.hero{padding:clamp(8px,3vh,40px) max(5vw,16px) 8px;text-align:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin:0 0 18px}
.mega{margin:0;font-weight:900;font-size:clamp(52px,9.4vw,140px);line-height:.86;letter-spacing:-.05em;text-transform:uppercase}
.mega span{display:block;background:linear-gradient(150deg,#fff 0%,#e9d5ff 42%,#f472b6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.04em}
.subhead{margin:26px auto 0;font-weight:800;font-size:clamp(20px,2.6vw,32px);letter-spacing:-.02em;line-height:1.15}
.subhead em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:56px;height:2px;margin:22px auto 0;background:var(--grad);border-radius:2px}
.open{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;max-width:1180px;margin:clamp(20px,4vh,44px) auto 0;padding:0 max(5vw,16px) 64px}
.media{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(80% 90% at 30% 20%,rgba(217,70,239,.28),transparent 60%),linear-gradient(160deg,#2b0b5c,#12021f)}
.media.lb{aspect-ratio:auto;min-height:clamp(260px,30vw,340px);display:flex}.media.lb .letter{position:relative;inset:auto;flex:1;gap:20px}
.media iframe,.media video{position:absolute;inset:0;width:100%;height:100%;border:0}
.letter{position:absolute;inset:0;padding:clamp(20px,3.4vw,40px);display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.letter q{font-weight:800;font-size:clamp(19px,2.1vw,27px);line-height:1.18;letter-spacing:-.02em;quotes:"\201C" "\201D"}
.letter .who{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;font-size:14px;color:var(--mut)}
.letter .who .btn{min-height:44px;padding:10px 18px;font-size:15px}
.letter .who b{color:#fff;display:block}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--lav)}
.tag .ico{width:14px;height:14px}
.ask{text-align:left}
.ask h2{margin:0 0 14px;font-weight:900;font-size:clamp(30px,3.6vw,48px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.ask p{color:var(--mut);margin:0 0 26px;max-width:46ch}
.ask .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.resume{margin-top:22px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);font-size:15px;color:var(--mut)}
.resume b{color:#fff}
.resume .row{margin-top:10px}

/* message overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(12,2,24,.86);backdrop-filter:blur(8px);overflow:auto;padding:max(4vh,16px) 16px}
.msg{max-width:720px;margin:0 auto;background:linear-gradient(170deg,#2a0b56,#170330);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,56px)}
.msg h2{margin:0 0 22px;font-weight:900;font-size:clamp(32px,5vw,52px);letter-spacing:-.04em;line-height:1}
.msg h2 span{background:linear-gradient(150deg,#fff,#e9d5ff 42%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg p{font-size:18px;line-height:1.65;color:rgba(255,255,255,.86);margin:0 0 18px}
.msg .q{font-weight:800;color:#fff}
.msg .sig{margin-top:28px;color:var(--mut);font-size:15px}
.msg .sig b{color:#fff;font-size:17px}
.msg .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.x{float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;margin:-8px -8px 0 12px}

/* interview */
.prog{flex:1;max-width:520px;margin:0 auto}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--faint);margin-bottom:6px;letter-spacing:.02em}
.prog .lbl b{color:var(--lav)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .35s}
.stage{max-width:860px;margin:0 auto;padding:clamp(20px,5vh,56px) max(5vw,16px) 140px}
.kicker{font-size:14px;font-weight:700;color:var(--pink);margin:0 0 12px}
.qh{margin:0 0 14px;font-weight:900;font-size:clamp(30px,4.4vw,50px);line-height:1.05;letter-spacing:-.035em;text-wrap:balance;outline:none}
.help{color:var(--mut);font-size:17px;margin:0 0 28px;max-width:60ch}
.carry{display:inline-block;font-size:15px;color:var(--lav);background:rgba(233,213,255,.08);border:1px solid rgba(233,213,255,.18);padding:8px 14px;border-radius:12px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:76px;padding:18px 52px 18px 20px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:rgba(255,255,255,.35)}
.card .ct{font-weight:700;font-size:17px;line-height:1.3}
.card .cd{font-size:14px;color:var(--mut)}
.card .tick{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.card .tick .ico{width:15px;height:15px;opacity:0;stroke-width:2.6}
.card.on{border-color:var(--mag);background:rgba(217,70,239,.14)}
.card.on .tick{background:var(--grad);border-color:transparent}
.card.on .tick .ico{opacity:1}
.card[disabled]{cursor:not-allowed;opacity:.55}
.card .soon{font-size:12px;font-weight:700;color:var(--lav);margin-top:6px}
.card.sug:not(.on){border-style:dashed;border-color:rgba(244,114,182,.6)}
.card .why{font-size:12px;font-weight:700;color:var(--pink)}
.cards.roles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fields{display:grid;gap:20px;margin-top:8px}
.f label,.f .fl{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.f .hint{font-size:14px;color:var(--faint);margin-top:6px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:#fff;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
input:focus,textarea:focus{border-color:var(--mag);outline:none;box-shadow:0 0 0 4px rgba(217,70,239,.2)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input[type=date]{color-scheme:dark;max-width:240px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:none;font-size:14px;font-weight:600;color:var(--lav);cursor:pointer}
.chip:hover{background:var(--panel);color:#fff}
.chip.on{background:rgba(217,70,239,.2);border-color:var(--mag);color:#fff}
.pick{margin:14px 0 0;font-size:15px;font-weight:700;color:var(--mut)}
.sub{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.sub h3{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.sub .p{color:var(--mut);margin:0 0 14px}
.ex{margin-top:12px;padding:16px 18px;border-radius:14px;background:rgba(233,213,255,.08);border:1px dashed rgba(233,213,255,.3);color:rgba(255,255,255,.88);font-size:15px}
.ex b{display:block;color:var(--lav);font-size:13px;margin-bottom:4px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px max(5vw,16px) max(16px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(22,3,41,.97) 55%,rgba(22,3,41,0))}
.foot .r{display:flex;gap:10px;align-items:center}
.need{font-size:14px;color:var(--faint)}

/* targets */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
.inwrap{position:relative}
.inwrap .pre,.inwrap .suf{position:absolute;top:50%;transform:translateY(-50%);color:var(--faint);font-weight:600;pointer-events:none}
.inwrap .pre{left:16px}.inwrap .suf{right:16px;font-size:14px}
.inwrap.p input{padding-left:32px}.inwrap.s input{padding-right:110px}
.proj{border-radius:20px;padding:24px;background:linear-gradient(160deg,rgba(217,70,239,.2),rgba(109,40,217,.16));border:1px solid rgba(233,213,255,.2)}
.proj .k{font-size:14px;font-weight:700;color:var(--lav)}
.proj .v{font-weight:900;font-size:clamp(34px,4.4vw,52px);letter-spacing:-.03em;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.proj .m{font-size:14px;color:var(--mut);margin-top:2px}
.proj hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:18px 0}
.proj .formula{font-size:13px;color:var(--faint);margin-top:16px}
.priv{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:15px;color:var(--mut)}
.priv .ico{color:var(--lav);margin-top:2px}
.check{display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:600;min-height:44px}
.check input{width:22px;height:22px;accent-color:#d946ef;flex:none}
.jump{display:grid;gap:8px;margin:18px 0 0}
.jump button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;min-height:48px}
.jump button span{font-size:13px;color:var(--faint);font-weight:600}

/* plan sheet */
.planwrap{max-width:980px;margin:0 auto;padding:8px max(4vw,16px) 80px}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0 18px}
.ptools .r{display:flex;flex-wrap:wrap;gap:10px}
.sheet{background:var(--sheet);color:var(--sink);border-radius:22px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.shead{padding:clamp(24px,4vw,44px);background:radial-gradient(70% 120% at 85% 0%,rgba(217,70,239,.35),transparent 60%),linear-gradient(160deg,#2a0b56,#160329);color:#fff;display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.shead .t{font-size:13px;font-weight:800;color:var(--pink);margin:0 0 6px}
.shead h1{margin:0;font-weight:900;font-size:clamp(32px,5vw,54px);letter-spacing:-.04em;line-height:1}
.shead .who{margin-top:10px;color:rgba(255,255,255,.8);font-weight:600}
.shead .logo{width:40px;height:48px}
.sbody{padding:clamp(20px,4vw,44px)}
.start{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 22px;align-items:center;padding:22px;border-radius:18px;background:#faf5ff;border:1.5px solid #e9d5ff;margin-bottom:30px}
.datebox{width:96px;text-align:center;border-radius:14px;background:#4c1d95;color:#fff;padding:10px 6px;line-height:1.1}
.datebox .mo{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#f5d0fe}
.datebox .d{font-size:36px;font-weight:900;letter-spacing:-.03em}
.datebox .dw{font-size:12px;font-weight:700;color:#e9d5ff}
.start .k{font-size:13px;font-weight:800;color:var(--sacc)}
.start .a{font-size:clamp(18px,2.2vw,22px);font-weight:800;line-height:1.3;letter-spacing:-.01em}
.say{border-left:0;margin:0 0 34px;padding:0;display:grid;gap:10px}
.say p{margin:0;font-size:17px;line-height:1.5}
.say p b{color:var(--sp)}
.sec{margin-top:34px}
.sec>h2{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-weight:900;font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;color:var(--sp);padding-bottom:10px;border-bottom:2px solid #ede9fe}
.sec>h2 .pct{margin-left:auto;font-size:13px;font-weight:700;color:#7c6a99;letter-spacing:0}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:22px}
.num{padding:14px;border-radius:14px;background:#f8f5fc}
.num .k{font-size:12px;font-weight:700;color:#6b5a86}
.num .v{font-size:22px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.num.hi{background:#4c1d95;color:#fff}.num.hi .k{color:#e9d5ff}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 28px}
.it{padding:12px 0;border-bottom:1px solid #f0ebf7}
.it .k{font-size:13px;font-weight:800;color:#6b5a86;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.it .v{font-size:16px;white-space:pre-wrap}
.it .v:empty::before{content:"Not answered yet";color:#a99bbd;font-style:italic}
[contenteditable]{border-radius:6px;outline:none;transition:background .15s}
[contenteditable]:hover{background:#faf5ff}
[contenteditable]:focus{background:#f5f0ff;box-shadow:0 0 0 2px #d8b4fe}
.lock{font-size:11px;font-weight:800;color:#7c3aed;background:#ede9fe;border-radius:999px;padding:2px 8px;display:inline-flex;gap:4px;align-items:center}
.lock .ico{width:12px;height:12px}
.pri-blk{margin-top:18px;border:1.5px solid #ede9fe;border-radius:18px;padding:20px 22px;break-inside:avoid}
.pri-blk h3{margin:0 0 4px;font-size:20px;font-weight:900;letter-spacing:-.02em}
.pri-blk h3 small{display:block;font-size:12px;font-weight:800;color:var(--sacc);letter-spacing:.02em;margin-bottom:2px}
.perf{margin-top:34px;padding:24px;border-radius:18px;background:#160329;color:#fff;break-inside:avoid}
.perf h2{margin:0 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em}
.perf ol{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:14px 0}
.perf li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.perf li span{background:rgba(255,255,255,.1);padding:8px 12px;border-radius:10px}
.perf li .ico{width:16px;height:16px;color:var(--pink)}
.perf li:last-child .ico{display:none}
.perf .dl{color:var(--lav);font-weight:600;margin:6px 0 0}
.perf .acts{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.perf .st{font-size:14px;color:var(--mut)}
.store{font-size:14px;color:var(--mut);margin:14px 2px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#fff;color:#1c0b33;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 20px 40px -10px rgba(0,0,0,.5)}


/* light interior */
.card .tick{color:#fff}
.card[disabled] .tick.lk{border:0;color:var(--faint)}
.card[disabled] .tick.lk .ico{opacity:1;width:18px;height:18px;stroke-width:1.8}
body.light{background:#faf8fd;color:#2e1065;--ink:#2e1065;--mut:#5b4a7a;--faint:#8a7ba3;--line:#e4dcef;--panel:#fff}
body.light .top{background:rgba(250,248,253,.94);backdrop-filter:blur(8px);border-bottom:1px solid #eee7f6}
body.light .top .logo{color:#4c1d95}
body.light .prog .lbl b{color:#6d28d9}
body.light .bar{background:#ece5f5}
body.light .bar i{background:linear-gradient(92deg,#6d28d9,#a21caf)}
body.light .kicker{color:#a21caf}
body.light .qh{color:#3b0764}
body.light .help{color:#5b4a7a}
body.light .carry{color:#5b21b6;background:#f3edfc;border-color:#e4d7f7}
body.light .card{background:#fff;border-color:#e4dcef;box-shadow:0 1px 2px rgba(46,16,101,.04)}
body.light .card:hover{border-color:#c4b5fd}
body.light .card .ct{color:#2e1065}
body.light .card .tick{border-color:#d8cdea}
body.light .card.on{background:#f5effe;border-color:#7c3aed}
body.light .card.on .tick{background:#6d28d9;border-color:#6d28d9}
body.light .card.sug:not(.on){border-color:#e879f9}
body.light .card .why{color:#a21caf}
body.light input[type=text],body.light input[type=date],body.light textarea{background:#fff;border-color:#ddd3ec;color:#2e1065;color-scheme:light}
body.light input::placeholder,body.light textarea::placeholder{color:#a99bbd}
body.light input:focus,body.light textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,.14)}
body.light .chip{color:#5b21b6;border-color:#ddd3ec;background:#fff}
body.light .chip:hover{background:#f5effe;color:#3b0764;border-color:#c4b5fd}
body.light .chip.on{background:#ede4fc;border-color:#7c3aed;color:#3b0764}

/* ---------- form builders ---------- */
const fid = p => 'f-' + p.replace(/\./g, '-');
function cards(path, opts, { multi = true, max = 0, cls = '', sug = [] } = {}) {
  const cur = get(path);
  return `<div class="cards ${cls}" role="group">${opts.map(o => {
    const on = multi ? (cur || []).includes(o.v) : cur === o.v;
    const s = sug.includes(o.v);
    return `<button type="button" class="card${on ? ' on' : ''}${s ? ' sug' : ''}" aria-pressed="${on}" data-act="${multi ? 'toggle' : 'pick'}" data-path="${path}" data-val="${o.v}"${max ? ` data-max="${max}"` : ''}${o.dis ? ' disabled aria-disabled="true"' : ''}>
      ${s && !on ? '<span class="why">Suggested from your answers</span>' : ''}<span class="ct">${esc(o.t)}</span>${o.d ? `<span class="cd">${esc(o.d)}</span>` : ''}${o.soon ? `<span class="soon">${esc(o.soon)}</span>` : ''}
      ${o.dis ? `<span class="tick lk" title="Not available yet">${I.lock}</span>` : `<span class="tick">${I.check}</span>`}</button>`;
  }).join('')}</div>`;
}
const ta = (p, ph, rows = 3) => `<textarea id="${fid(p)}" data-bind="${p}" rows="${rows}" placeholder="${esc(ph)}">${esc(get(p) || '')}</textarea>`;
const inp = (p, ph, extra = '') => `<input type="text" id="${fid(p)}" data-bind="${p}" value="${esc(get(p) || '')}" placeholder="${esc(ph)}" ${extra}>`;
const field = (label, p, ctrl, hint = '') => `<div class="f"><label for="${fid(p)}">${label}</label>${ctrl}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
const fills = (p, arr) => `<div class="chips" aria-label="Ideas">${arr.map(t => { const on = (get(p) || '').includes(t); return `<button type="button" class="chip${on ? ' on' : ''}" aria-pressed="${on}" data-act="fill" data-path="${p}" data-text="${esc(t)}">${esc(t)}</button>`; }).join('')}</div>`;
const tags = (p, arr) => { const cur = get(p) || []; return `<div class="chips">${arr.map(t => `<button type="button" class="chip${cur.includes(t) ? ' on' : ''}" aria-pressed="${cur.includes(t)}" data-act="toggle" data-path="${p}" data-val="${esc(t)}">${esc(t)}</button>`).join('')}</div>`; };
const exBtn = (key, text) => `<button type="button" class="link" data-act="ex" data-key="${key}" aria-expanded="${!!S.ui[key]}">${I.bulb}${S.ui[key] ? 'Hide the example' : 'Show me an example'}</button>${S.ui[key] ? `<div class="ex"><b>Example</b>${esc(text)}</div>` : ''}`;

}

function message() {
  ov.innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="mh"><article class="msg rise">
    <button type="button" class="x" data-act="close" aria-label="Close message">${I.x}</button>
    <p class="eyebrow" style="margin-bottom:10px">A message from Michael</p><h2 id="mh" tabindex="-1"><span>Build Something Bigger</span></h2>
    ${MESSAGE.map(p => `<p>${esc(p)}</p>`).join('')}<p class="q">Let’s start with you. What do you want to build in 2027?</p>
    <div class="sig"><b>Michael Rappaport</b><br>President, Homespire Home Loans</div>
    <div class="row"><button type="button" class="btn pri big" data-act="${hasDraft() ? 'go' : 'start'}">Build My Plan ${I.right}</button><button type="button" class="btn ghost" data-act="close">Close</button></div></article></div>`;
  document.getElementById('mh').focus();
}

function interview() {
  const list = steps(); if (S.step >= list.length) S.step = list.length - 1; if (S.step < 0) S.step = 0;
  const st = list[S.step], prodN = list.filter(s => s.sec === 'production').length, isBranch = st.sec === 'branch';
  const idx = isBranch ? S.step - prodN + 1 : S.step + 1, of = isBranch ? list.length - prodN : prodN;
  const ok = !st.need || st.need();
  const last = S.step === list.length - 1;
  app.innerHTML = `<header class="top">${brand}
    <div class="prog"><div class="lbl"><b>${isBranch ? 'My Branch' : 'My Production'}</b><span>Question ${idx} of ${of}${isBM() ? (isBranch ? '' : ' · then My Branch') : ''}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${S.step + 1}" aria-label="Progress"><i style="width:${((S.step + 1) / list.length) * 100}%"></i></div></div>
    <span class="saved" id="saved">${savedHTML()}</span></header>
  <main class="stage rise" id="stage">${st.r()}</main>
  <nav class="foot" aria-label="Interview navigation"><button type="button" class="btn ghost" data-act="back">${I.left} Back</button>
    <div class="r">${S.planReady ? `<button type="button" class="btn" data-act="plan">Return to My Plan</button>` : ''}
    ${st.skip ? `<button type="button" class="btn ghost" data-act="skip">Skip this question</button>` : ''}
    ${!ok && st.needMsg ? `<span class="need" id="needmsg">${st.needMsg}</span>` : ''}
    <button type="button" class="btn pri" data-act="next" id="nextBtn" ${ok ? '' : 'disabled'}>${last ? 'See My 2027 Plan' : 'Continue'} ${I.right}</button></div></nav>`;
  if (st.id === 'targets') paintProj();
}

function paintProj() {
  const v = vol(), i = inc(), u = num(S.units);
  const q = id => document.getElementById(id);
  if (!q('pv')) return;
  q('pv').textContent = usd(v); q('pi').textContent = usd(i);
  q('pvm').textContent = v ? `About ${short(v / 12)} a month, ${(u / 12).toFixed(1)} closings a month` : 'Enter your targets to see your projection';
  q('pim').textContent = i ? `About ${usd(i / 12)} a month` : '';
  const c = num(S.closed), g = q('gap');
  if (g) g.textContent = c && u ? (u > c ? `That’s ${u - c} more closings than 2026.` : u === c ? 'The same number of closings as 2026.' : `That’s ${c - u} fewer closings than 2026.`) : '';
}
function checkNeed() {
  const st = steps()[S.step], b = document.getElementById('nextBtn'); if (!st || !b) return;
  const ok = !st.need || st.need(); b.disabled = !ok; const m = document.getElementById('needmsg'); if (m) m.style.display = ok ? 'none' : '';
}

function ed(p, ph = '') { return `<div class="v" contenteditable="true" spellcheck="true" data-edit="${p}" aria-label="${esc(ph)}" role="textbox" aria-multiline="true">${esc(get(p) || '')}</div>`; }
function item(k, p, extra = '') { return `<div class="it"><div class="k">${k}${extra}</div>${ed(p, k)}</div>`; }

function firstAction() {
  const a = S.pri.map(v => ({ v, c: (S.commit || {})[v] || {} })).filter(x => x.c.action);
  a.sort((x, y) => (x.c.date || '9') < (y.c.date || '9') ? -1 : 1);
  return a[0];
}

function plan() {
  const fa = firstAction(), bm = isBM();
  const d = fa && fa.c.date ? fa.c.date.split('-').map(Number) : null, dt = d ? new Date(d[0], d[1] - 1, d[2]) : null;
  const incomeWords = [...S.income, S.incomeOwn.trim()].filter(Boolean).join('. ');
  const helpFor = v => { const c = (S.commit || {})[v] || {}; return [...(c.help || []), (c.helpOwn || '').trim()].filter(Boolean).join(', '); };
  const proud = S.proud.filter(v => v !== 'own').map(v => PROUD.find(p => p.v === v).t).concat(S.proud.includes('own') && S.proudOwn ? [S.proudOwn] : []);
  const objection = S.objection === 'own' ? S.objectionOwn : S.objection;
  app.innerHTML = `<header class="top noprint">${brand}<span class="sp"></span><span class="saved" id="saved">${savedHTML()}</span></header>
  <div class="planwrap">
  <div class="ptools noprint"><div class="r"><button type="button" class="btn" data-act="editlist">${I.edit} Edit My Answers</button>
    <button type="button" class="btn" data-act="print">${I.print} Print / Save as PDF</button><button type="button" class="btn ghost" data-act="copy">${I.copy} Copy as text</button></div>
    <span class="need">Click any answer below to edit it in place.</span></div>
  <article class="sheet rise">
    <header class="shead"><div><p class="t">Build Something Bigger</p><h1>My 2027 Build Plan</h1>
      <div class="who">${esc(S.name)}${S.branch ? ' · ' + esc(S.branch) : ''} · ${esc(roleLabel())}</div></div><span class="logo">${LOGO}</span></header>
    <div class="sbody">
    ${fa ? `<div class="start">${dt ? `<div class="datebox"><div class="mo">${dt.toLocaleDateString('en-US', { month: 'short' })}</div><div class="d">${dt.getDate()}</div><div class="dw">${dt.toLocaleDateString('en-US', { weekday: 'short' })}</div></div>` : `<div class="datebox"><div class="mo">Date</div><div class="d">?</div></div>`}
      <div><div class="k">The first thing I’m doing</div><div class="a">${esc(fa.c.action)}</div></div></div>` : ''}
    <div class="say">
      <p><b>Here’s what I want to build:</b> ${esc(S.toward || 'Not answered yet')}</p>
      ${incomeWords ? `<p><b>Here’s why it matters to me:</b> ${esc(incomeWords)}</p>` : ''}
      ${fa ? `<p><b>Here’s the first thing I’m doing:</b> ${esc(fa.c.action)}${fa.c.date ? ', by ' + fmtDate(fa.c.date) : ''}.</p>` : ''}
      ${bm && S.team && S.team.who ? `<p><b>And here’s who I’m going to help:</b> ${esc(S.team.who)}.</p>` : ''}
    </div>

    <section class="sec"><h2>My Production${bm ? '<span class="pct">About 75% of this plan</span>' : ''}</h2>
      <div class="nums"><div class="num"><div class="k">Units</div><div class="v">${num(S.units).toLocaleString('en-US')}</div></div>
        <div class="num"><div class="k">Avg loan</div><div class="v">${short(num(S.avg))}</div></div>
        <div class="num"><div class="k">Commission</div><div class="v">${num(S.bps)} bps</div></div>
        <div class="num hi"><div class="k">Projected volume</div><div class="v">${usd(vol())}</div></div>
        <div class="num hi"><div class="k">Projected income</div><div class="v">${usd(inc())}</div></div></div>
      <div class="grid2">
        ${item('What I want to build', 'toward')}
        <div class="it"><div class="k">Where my business will come from</div><div class="v">${esc(srcText())}</div></div>
        <div class="it"><div class="k">What I want to feel more confident doing</div><div class="v">${esc(confText())}${objection ? `\nObjection to practice: ${esc(objection)}` : ''}${S.practiceWith ? `\nPracticing with: ${esc(S.practiceWith)}` : ''}</div></div>
        ${incomeWords ? `<div class="it"><div class="k">What reaching it would make possible</div><div class="v">${esc(incomeWords)}</div></div>` : ''}
      </div>
      ${S.pri.map((v, i) => { const b = 'commit.' + v + '.', c = (S.commit || {})[v] || {}; return `<div class="pri-blk"><h3><small>Priority ${i + 1}</small>${esc(priTitle(v))}</h3>
        <div class="grid2">${item('First action' + (c.date ? ' · by ' + fmtDate(c.date) : ''), b + 'action')}
        <div class="it"><div class="k">Support</div><div class="v">${esc(helpFor(v))}</div></div>
        ${item('By March 31, this is working if', b + 'measure')}</div></div>`; }).join('')}
    </section>

    ${bm ? `<section class="sec"><h2>My Branch<span class="pct">About 25% of this plan</span></h2>
      <div class="grid2">${item('Who I’m going to help have a better year', 'team.who')}${item('The skill or opportunity', 'team.skill')}
      ${item('What we’ll do together', 'team.together')}${item('A local producer I want to know better', 'recruit.who')}
      ${item('Why they might enjoy our branch', 'recruit.why')}${item('A natural first step', 'recruit.step')}
      <div class="it"><div class="k">By March 31, I’ll be proud if</div><div class="v">${esc(proud.join('\n'))}</div></div>
      ${item('Help I’d like from Michael or division leadership', 'leaderHelp')}</div></section>` : ''}

    <section class="perf"><h2>Save your goals in Performance</h2>
      <p style="margin:0;color:rgba(255,255,255,.72)">Performance is the official place for your annual goals. This worksheet is your coaching plan.</p>
      <ol aria-label="Steps in Performance">${['Open Performance', 'Goals', 'Select 2027', 'Review your targets', 'Save Goals'].map(s => `<li><span>${s}</span>${I.right}</li>`).join('')}</ol>
      <p style="margin:0;font-size:15px">Enter: <b>${num(S.units)} units</b> · <b>${usd(num(S.avg))}</b> average loan · <b>${num(S.bps)} bps</b></p>
      <p class="dl">${esc((CONFIG.roles[S.role] || {}).deadline || '')}</p>
      <div class="acts noprint"><button type="button" class="btn pri" data-act="saveplan">${I.save} Save My Plan</button>
        <span class="st" id="savest">${S.savedAt ? 'Plan saved ' + new Date(S.savedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '.' : 'Not saved yet.'}</span>
        <label class="check"><input type="checkbox" data-bind="perfDone" ${S.perfDone ? 'checked' : ''}> I’ve saved my 2027 goals in Performance</label></div>
    </section>
    </div></article>
    <p class="store noprint">${storageOk ? 'Your plan and draft are saved in this browser on this device. They won’t follow you to another computer or phone, and clearing browser data removes them. Print or save a PDF to keep a copy.' : 'This browser isn’t letting us save a draft. Print or save a PDF before you close this page.'}</p>
  </div>`;
}

function editList() {
  const list = steps();
  ov.innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="eh"><div class="msg rise">
    <button type="button" class="x" data-act="close" aria-label="Close">${I.x}</button><h2 id="eh" tabindex="-1" style="font-size:32px">Edit My Answers</h2>
    <p style="font-size:16px;color:var(--mut)">Jump to any question. Your answers are kept, and you can return to your plan at any time.</p>
    <div class="jump">${list.map((s, i) => `<button type="button" data-act="jumpto" data-i="${i}">${esc(stepName(s))}<span>${s.sec === 'branch' ? 'My Branch' : 'My Production'}</span></button>`).join('')}</div></div></div>`;
  document.getElementById('eh').focus();
}
const stepName = s => ({ about: 'Name, branch and role', toward: 'What I want to build', src: 'Where my business will come from', conf: 'What I want to feel more confident doing', targets: 'My 2027 targets', income: 'What it would make possible', pri: 'My three priorities', commit0: 'Commitment: ' + (S.pri[0] ? priTitle(S.pri[0]) : 'priority 1'), commit1: 'Commitment: ' + (S.pri[1] ? priTitle(S.pri[1]) : 'priority 2'), commit2: 'Commitment: ' + (S.pri[2] ? priTitle(S.pri[2]) : 'priority 3'), team: 'Who I’ll help', recruit: 'A producer to get to know', proud: 'March 31 branch progress' })[s.id];

function planText() {
  const L = [], fa = firstAction();
  L.push('MY 2027 BUILD PLAN', [S.name, S.branch, roleLabel()].filter(Boolean).join(' | '), '');
  L.push('What I want to build: ' + (S.toward || ''));
  if (S.income.length || S.incomeOwn) L.push('Why it matters: ' + [...S.income, S.incomeOwn].filter(Boolean).join('. '));
  if (fa) L.push('First thing I’m doing: ' + fa.c.action + (fa.c.date ? ' (by ' + fmtDate(fa.c.date) + ')' : ''));
  L.push('', 'MY PRODUCTION', `Targets: ${num(S.units)} units, ${usd(num(S.avg))} avg loan, ${num(S.bps)} bps`, `Projected volume: ${usd(vol())}`, `Projected income: ${usd(inc())}`);
  S.pri.forEach((v, i) => { const c = (S.commit || {})[v] || {}; L.push('', `Priority ${i + 1}: ${priTitle(v)}`, '  First action: ' + (c.action || '') + (c.date ? ' (by ' + fmtDate(c.date) + ')' : ''), '  Support: ' + [...(c.help || []), c.helpOwn].filter(Boolean).join(', '), '  March 31 measure: ' + (c.measure || '')); });
  if (isBM()) { const t = S.team || {}, r = S.recruit || {}; L.push('', 'MY BRANCH', `Who I’ll help: ${t.who || ''}. ${t.skill || ''} Together: ${t.together || ''}`, `Producer to get to know: ${r.who || ''}. ${r.why || ''} First step: ${r.step || ''}`, 'March 31: ' + S.proud.map(v => v === 'own' ? S.proudOwn : PROUD.find(p => p.v === v).t).join('; '), 'Help from leadership: ' + (S.leaderHelp || '')); }
  return L.join('\n');
}

function toast(t) { const el = document.getElementById('toast'); el.innerHTML = `<div class="toast">${esc(t)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => el.innerHTML = '', 2600); }

function render(focus = true) {
  ov.innerHTML = '';
  document.body.classList.toggle('light', S.view !== 'welcome');
  if (S.view === 'plan') plan(); else if (S.view === 'interview') interview(); else welcome();
  if (focus) { window.scrollTo(0, 0); const h = app.querySelector('.qh,.shead h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, p = b.dataset.path;
  if (a === 'start') { S.view = 'interview'; S.step = 0; save(); render(); }
  else if (a === 'go') { S.view = 'interview'; save(); render(); }
  else if (a === 'home') { S.view = 'welcome'; save(); render(); }
  else if (a === 'msg') message();
  else if (a === 'close') { ov.innerHTML = ''; }
  else if (a === 'plan') { S.view = 'plan'; save(); render(); }
  else if (a === 'reset') {
    if (b.dataset.sure) { try { localStorage.removeItem(CONFIG.storageKey); } catch (x) {} S = BLANK(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Tap again to erase your draft'; }
  }
  else if (a === 'next') { const n = steps().length; if (S.step < n - 1) { S.step++; } else { S.planReady = true; S.view = 'plan'; } save(); render(); }
  else if (a === 'skip') { S.step++; save(); render(); }
  else if (a === 'back') { if (S.step > 0) S.step--; else S.view = S.planReady ? 'plan' : 'welcome'; save(); render(); }
  else if (a === 'pick') { set(p, b.dataset.val); if (p === 'role') S.step = 0; rerender(); }
  else if (a === 'toggle') {
    const cur = (get(p) || []).slice(), v = b.dataset.val, max = +b.dataset.max || 0, i = cur.indexOf(v);
    if (i >= 0) cur.splice(i, 1); else { if (max && cur.length >= max) cur.shift(); cur.push(v); }
    set(p, cur); rerender();
  }
  else if (a === 'fill') {
    const el = document.getElementById(fid(p)), t = b.dataset.text, cur = (get(p) || '').trim(), isIn = el && el.tagName === 'INPUT';
    let v;
    if (cur.includes(t)) v = cur.replace(t, '').replace(/^[\s.,]+|[\s,]+$/g, '').replace(/([.,])\s*[.,]+/g, '$1').replace(/\s{2,}/g, ' ').trim();
    else v = cur ? (isIn ? cur.replace(/[,\s]*$/, '') + ', ' : cur.replace(/[.\s]*$/, '') + '. ') + t : t;
    set(p, v); if (el) el.value = v;
    const on = v.includes(t); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); checkNeed(); }
  else if (a === 'ex') { S.ui[b.dataset.key] = !S.ui[b.dataset.key]; rerender(); }
  else if (a === 'editlist') editList();
  else if (a === 'jumpto') { S.step = +b.dataset.i; S.view = 'interview'; save(); render(); }
  else if (a === 'print') { try { window.print(); } catch (x) { toast('Use your browser’s Print command to save a PDF'); } }
  else if (a === 'copy') { navigator.clipboard.writeText(planText()).then(() => toast('Plan copied as text'), () => toast('Copy isn’t available here')); }
  else if (a === 'saveplan') { S.savedAt = new Date().toISOString(); save(); const s = document.getElementById('savest'); if (s) s.textContent = storageOk ? 'Plan saved in this browser on this device, ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '.' : 'This browser won’t save. Print or save a PDF instead.'; toast(storageOk ? 'Plan saved on this device' : 'Saving isn’t available in this browser'); }
});
function rerender() {
  const y = window.scrollY, ae = document.activeElement, key = ae && ae.dataset ? (ae.dataset.val != null ? ae.dataset.path + '|' + ae.dataset.val : ae.dataset.act === 'ex' ? 'ex|' + ae.dataset.key : '') : '';
  render(false); window.scrollTo(0, y);
  if (key) { const [p, v] = key.split('|'); const el = p === 'ex' ? app.querySelector(`[data-act="ex"][data-key="${v}"]`) : [...app.querySelectorAll('[data-val]')].find(x => x.dataset.path === p && x.dataset.val === v); if (el) el.focus({ preventScroll: true }); }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.edit) { set(el.dataset.edit, el.innerText.trim()); return; }
  const p = el.dataset.bind; if (!p) return;
  if (el.type === 'checkbox') { set(p, el.checked); if (el.dataset.rerender) rerender(); return; }
  let v = el.value;
  if (el.dataset.num === 'int' || el.dataset.num === 'money') v = v.replace(/[^0-9]/g, '');
  if (el.dataset.num === 'dec') v = v.replace(/[^0-9.]/g, '');
  if (el.dataset.num === 'money' && v) { el.value = Number(v).toLocaleString('en-US'); }
  else if (el.dataset.num) el.value = v;
  set(p, v); paintProj(); checkNeed();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ov.innerHTML) ov.innerHTML = ''; });

if (S.view === 'interview' && !S.role) S.view = 'welcome';
render();
}
</script>
</body>
</html>
